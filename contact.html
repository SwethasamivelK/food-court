<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Food Court</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* BASE */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(135deg,#f8fafc,#eef2ff);
  color:#111827;
  overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
}

body::before{
  width:360px;
  height:360px;
  background:#ff6b35;
  top:-120px;
  left:-120px;
  opacity:.18;
}

body::after{
  width:320px;
  height:320px;
  background:#6366f1;
  bottom:-120px;
  right:-120px;
  opacity:.15;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  backdrop-filter:blur(18px);
  background:rgba(255,255,255,.75);
  border-bottom:1px solid rgba(255,255,255,.4);
  z-index:1000;
}

.nav-container{
  width:90%;
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
}

.logo{
  font-size:1.8rem;
  font-weight:800;
  background:linear-gradient(135deg,#ff6b35,#ffb703);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.nav-links a{
  margin-left:20px;
  text-decoration:none;
  color:#374151;
  font-weight:600;
}

/* HERO */
.hero{
  padding:140px 20px 40px;
  text-align:center;
}

.hero h1{
  font-size:4rem;
  font-weight:800;
}

.hero p{
  color:#6b7280;
  margin-top:10px;
}

/* CONTAINER */
.container{
  width:90%;
  max-width:1200px;
  margin:auto;
  padding-bottom:80px;
}

/* SUPPORT SECTION */
.support{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-top:30px;
}

.support-box{
  background:white;
  padding:20px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 10px 20px rgba(0,0,0,.08);
  transition:.3s ease;
  cursor:pointer;
}

/* ONLY THESE HAVE HOVER EFFECT */
.support-box:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 20px 40px rgba(255,107,53,.25);
  background:linear-gradient(135deg,#fff,#fff7f2);
}

.support-box i{
  font-size:28px;
  color:#ff6b35;
  margin-bottom:10px;
  transition:.3s;
}

.support-box:hover i{
  transform:rotate(10deg) scale(1.2);
  color:#ffb703;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
  margin-top:40px;
}

/* CARD (NO HOVER FOR FORM/INFO) */
.card{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);
  border-radius:22px;
  padding:25px;
  box-shadow:0 15px 35px rgba(0,0,0,.08);
}

/* FORM */
input,textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#f3f4f6;
  outline:none;
}

textarea{
  height:120px;
  resize:none;
}

button{
  width:100%;
  margin-top:15px;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#ff6b35,#ffb703);
}

/* INFO */
.info-item{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.info-item i{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#ff6b35,#ffb703);
  color:white;
}

/* MAP (NO HOVER) */
.map{
  width:100%;
  height:260px;
  border-radius:18px;
  overflow:hidden;
  margin-top:15px;
}

.map iframe{
  width:100%;
  height:100%;
  border:0;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#25D366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

/* FOOTER */
footer{
  background:#0f172a;
  color:white;
  text-align:center;
  padding:40px;
  margin-top:50px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .hero h1{font-size:2.8rem;}
}

</style>
</head>

<body>

<!-- NAVBAR -->

  <nav>

    <div class="nav-container">

      <div class="logo">
        Food Court
      </div>

      <div class="nav-links">

        <a href="#">Home</a>
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>

        <button class="toggle-btn" id="themeToggle">
          <i class="fas fa-moon"></i>
        </button>

      </div>

    </div>

  </nav>

<!-- HERO -->
<section class="hero">
  <h1>Contact Us</h1>
  <p>Anna Nagar, Chennai</p>
</section>

<div class="container">

  <!-- SUPPORT -->
  <div class="support">
    <div class="support-box">
      <i class="fas fa-motorcycle"></i>
      Fast Delivery
    </div>

    <div class="support-box">
      <i class="fas fa-utensils"></i>
      Catering
    </div>

    <div class="support-box">
      <i class="fas fa-headset"></i>
      Support 24/7
    </div>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- FORM -->
    <div class="card">
      <h2>Send Message</h2>

      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Message"></textarea>

      <button>Send Message</button>
    </div>

    <!-- INFO -->
    <div class="card">
      <h2>Contact Info</h2>

      <div class="info-item">
        <i class="fas fa-map-marker-alt"></i>
        Anna Nagar, Chennai
      </div>

      <div class="info-item">
        <i class="fas fa-phone"></i>
        +91 98765 43210
      </div>

      <div class="info-item">
        <i class="fas fa-envelope"></i>
        foodcourt@gmail.com
      </div>

      <!-- MAP -->
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31099.98123973162!2d80.2100!3d13.0850!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5265c4d3c0c3d7%3A0x0!2sAnna%20Nagar%2C%20Chennai!5e0!3m2!1sen!2sin!4v1700000000000"
          allowfullscreen>
        </iframe>
      </div>

    </div>

  </div>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="#">
  <i class="fab fa-whatsapp"></i>
</a>

<!-- FOOTER -->
<footer>
  © 2026 Food Court | All Rights Reserved
</footer>

</body>
</html>
